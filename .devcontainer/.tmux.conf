# tmux内でも同じ色が出るように設定
set-option -g default-terminal screen-256color
set -g terminal-overrides 'xterm:colors=256'

# セッションがない状態で tmux a で起動すると画面を4分割した状態で始まる
if-shell '[ -z "$(tmux ls)" ]' {
    new-session -d
    split-window -h
    split-window -v
    select-pane -t 0
    split-window -v
    select-pane -t 0
}

# マウスサポート
set -g mouse on

# ctrl-b + m でマウス操作のオンオフを切り替える
bind m if-shell -F '#{mouse}' 'set -g mouse off' 'set -g mouse on'

# ステータスバーにマウス状態の表示を追加
set -g status-right 'Mouse: #{?mouse,on,off} | %Y-%m-%d %H:%M '

# ペイン移動をVimライクに
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
